[package]
name = "feier-one"
version = "0.1.0"
description = "飞儿一体 - 透明 AI 终端"
authors = ["爸爸", "飞儿"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [ "window-close", "window-unmaximize", "window-hide", "window-minimize", "shell-all", "window-maximize", "window-start-dragging", "window-show", "window-unminimize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lazy_static = "1.4"
encoding_rs = "0.8"
portable-pty = "0.9.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
